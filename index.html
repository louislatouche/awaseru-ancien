<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!--
    Politique de sécurité : le navigateur refusera tout ce qui ne vient pas de notre propre site.
    C'est un filet de sécurité, et cela garantit au passage la règle « aucune ressource externe ».
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src 'self' blob:; base-uri 'self'; form-action 'none'">
  <title>Replik</title>
  <meta name="description" content="Apprendre ses répliques de théâtre en japonais.">
  <!-- Le thème clair du design kit, comme Faktur et SessionConnect : il ne suit pas le mode sombre du téléphone. -->
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#6f7c6a">
  <!-- Tous les chemins sont relatifs (pas de / au début) pour fonctionner dans un sous-dossier. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <!-- Le design kit : tokens AVANT base, car base.css lit les variables de tokens.css. -->
  <link rel="stylesheet" href="css/polices.css">
  <link rel="stylesheet" href="design-kit/tokens.css">
  <link rel="stylesheet" href="design-kit/base.css">
  <!-- Les styles propres à Replik viennent en dernier : ils complètent le kit. -->
  <link rel="stylesheet" href="css/style.css">
  <!-- type="module" : le script s'exécute après le chargement de la page et peut utiliser import. -->
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Trois zones fixes. app.js remplit chacune selon l'écran affiché. -->
  <header id="barre" class="app-header"></header>
  <main id="ecran" class="app-main" tabindex="-1"></main>
  <nav id="onglets" class="tabbar" aria-label="Sections de la pièce" hidden></nav>

  <!-- Petit message temporaire (erreur de lecture, confirmation...). -->
  <p id="message" class="toast" role="status"></p>

  <noscript>Replik a besoin de JavaScript pour fonctionner.</noscript>
</body>
</html>
