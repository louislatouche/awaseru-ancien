<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- L'icône d'Awaseru : le livre et le rideau du logo, redessinés pour rester nets à toute taille. -->
  <rect width="512" height="512" rx="104" fill="#faf9f7"/>
  <g transform="translate(256 256) scale(.98) translate(-256.0 -252.5)">
    <!-- La couverture, derrière les pages -->
    <path d="M100 168H80a14 14 0 0 0-14 14v196a14 14 0 0 0 14 14h142c14 0 20 6 26 13 5 5 11 5 16 0 6-7 12-13 26-13h143a14 14 0 0 0 14-14V182a14 14 0 0 0-14-14h-18" fill="#faf9f7" stroke="#032e58" stroke-width="15" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- La page de droite -->
    <path d="M256 218c30-38 88-54 154-54v190c-66-6-122 2-154 28Z" fill="#faf9f7" stroke="#032e58" stroke-width="15" stroke-linejoin="round"/>
    <!-- Le rideau rouge : il sort de derrière la page de gauche et retombe jusqu'au bas de la page de droite -->
    <path d="M410 92H340C296 92 248 132 150 158L256 236C278 192 296 146 315 112C335 134 366 150 404 156C386 190 362 270 356 356H410Z" fill="#972124"/>
    <path d="M352 104c3 13 10 23 21 32M378 104c3 9 8 17 17 24" fill="none" stroke="#faf9f7" stroke-width="7" stroke-linecap="round"/>
    <!-- Le bord de la page de droite repasse devant le rideau : il l'enferme dans le livre -->
    <path d="M410 164v190c-66-6-122 2-154 28" fill="none" stroke="#032e58" stroke-width="15" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Deux bulles de dialogue, disposées comme dans une messagerie : l'une à gauche, l'autre à droite -->
    <path d="M282 212H306A12 12 0 0 1 318 224V238A12 12 0 0 1 306 250H284L268 266L272 249A12 12 0 0 1 270 238V224A12 12 0 0 1 282 212Z" fill="#e2b64d"/>
    <path d="M316 270H340A12 12 0 0 1 352 282V296A12 12 0 0 1 348 305L354 324L336 308H316A12 12 0 0 1 304 296V282A12 12 0 0 1 316 270Z" fill="#032e58"/>
    <!-- La page de gauche, devant le rideau, avec les lignes du texte -->
    <path d="M256 218c-30-46-88-66-154-64v200c66-6 122 2 154 28Z" fill="#faf9f7" stroke="#032e58" stroke-width="15" stroke-linejoin="round"/>
    <path d="M134 202c36 0 70 10 94 32M134 248c36 0 70 10 94 32M134 294c36 0 70 10 94 32" fill="none" stroke="#032e58" stroke-width="13" stroke-linecap="round"/>
  </g>
</svg>
